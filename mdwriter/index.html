<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markdown Editor - 简洁优雅</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app">
        <header class="toolbar">
            <div class="logo">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                    <polyline points="14 2 14 8 20 8"/>
                    <line x1="16" y1="13" x2="8" y2="13"/>
                    <line x1="16" y1="17" x2="8" y2="17"/>
                    <polyline points="10 9 9 9 8 9"/>
                </svg>
                <span>Markdown</span>
            </div>
            
            <div class="file-name" id="fileName">未命名.md</div>
            
            <div class="tools">
                <button class="tool-btn" data-action="bold" title="粗体 (Ctrl+B)">
                    <strong>B</strong>
                </button>
                <button class="tool-btn" data-action="italic" title="斜体 (Ctrl+I)">
                    <em>I</em>
                </button>
                <button class="tool-btn" data-action="heading1" title="标题1">
                    标题1
                </button>
                <button class="tool-btn" data-action="heading2" title="标题2">
                    标题2
                </button>
                <button class="tool-btn" data-action="list" title="列表">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="8" y1="6" x2="21" y2="6"/>
                        <line x1="8" y1="12" x2="21" y2="12"/>
                        <line x1="8" y1="18" x2="21" y2="18"/>
                        <line x1="3" y1="6" x2="3.01" y2="6"/>
                        <line x1="3" y1="12" x2="3.01" y2="12"/>
                        <line x1="3" y1="18" x2="3.01" y2="18"/>
                    </svg>
                </button>
                <button class="tool-btn" data-action="code" title="代码">
                    &lt;/&gt;
                </button>
                <button class="tool-btn" data-action="link" title="链接">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
                        <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
                    </svg>
                </button>
                <button class="tool-btn" data-action="image" title="图片">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                        <circle cx="8.5" cy="8.5" r="1.5"/>
                        <polyline points="21 15 16 10 5 21"/>
                    </svg>
                </button>
            </div>
            
            <div class="actions">
                <button class="action-btn" id="toggleEditorBtn" title="切换编辑区显示">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="20" x2="12" y2="14"/>
                        <line x1="6" y1="4" x2="12" y2="10"/>
                        <line x1="9" y1="20" x2="9" y2="14"/>
                        <line x1="15" y1="10" x2="15" y2="4"/>
                    </svg>
                </button>
                <button class="action-btn" id="openFolderBtn" title="打开文件夹">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
                    </svg>
                    打开文件夹
                </button>
                <button class="action-btn" id="openBtn">打开文件</button>
                <button class="action-btn primary" id="saveBtn">保存文件</button>
                <input type="file" id="fileInput" accept=".md" hidden>
            </div>
        </header>
        
        <div class="editor-container">
            <div class="sidebar" id="sidebar">
                <div class="sidebar-tabs">
                    <button class="sidebar-tab active" data-tab="files">文件</button>
                    <button class="sidebar-tab" data-tab="toc">目录</button>
                </div>
                <div class="sidebar-panel active" id="filesPanel">
                    <div class="sidebar-content" id="fileList">
                        <div class="toc-empty">请先打开一个文件夹</div>
                    </div>
                </div>
                <div class="sidebar-panel" id="tocPanel">
                    <div class="sidebar-content" id="toc">
                        <div class="toc-empty">暂无目录</div>
                    </div>
                </div>
            </div>
            
            <div class="editor-panels">
                <div class="panel" id="editorPanel">
                    <div class="panel-header">
                        <span class="panel-title">编辑</span>
                        <span class="word-count">0 字</span>
                    </div>
                    <textarea id="editor" placeholder="开始编写你的 markdown..."></textarea>
                </div>
                
                <div class="panel">
                    <div class="panel-header">
                        <span class="panel-title">预览</span>
                        <span class="panel-label">实时预览</span>
                    </div>
                    <div id="preview"></div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
